openapi: 3.1.0
info:
  title: Stackable Communication Service
  version: 0.1.0
paths:
  /v1/notifications:
    post:
      operationId: createNotification
      summary: Queue a notification for already-resolved recipients
      description: Repeated parents are merged into one message listing all their children. A repeated idempotencyKey returns the original with 200.
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNotification"
      responses:
        "200":
          description: Idempotency key already used; the original notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /v1/notifications/{id}/deliveries:
    get:
      operationId: getDeliveryCounts
      summary: Count of deliveries per status
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Counts for every status, zero when none
          content:
            application/json:
              schema:
                type: object
                required: [notificationId, counts]
                properties:
                  notificationId: { type: string, format: uuid }
                  counts:
                    type: object
                    required: [QUEUED, SENT, DELIVERED, FAILED, UNDELIVERED]
                    additionalProperties: { type: integer }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/inbox:
    get:
      operationId: listInbox
      summary: The calling user's notifications, newest first
      security:
        - serviceToken: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/InboxItem"
                  nextCursor: { type: [string, "null"] }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/inbox/{id}/read:
    post:
      operationId: markRead
      summary: Mark a notification read for the calling user
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Marked read (repeat calls keep the first read time)
          content:
            application/json:
              schema:
                type: object
                required: [read]
                properties:
                  read: { type: boolean }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/preferences:
    get:
      operationId: getPreferences
      summary: The calling user's channel preferences
      security:
        - serviceToken: []
      responses:
        "200":
          description: Preference rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferenceList"
        "401":
          $ref: "#/components/responses/Error"
    put:
      operationId: putPreferences
      summary: Upsert preferences for the listed types; other types are untouched
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferenceList"
      responses:
        "200":
          description: All of the user's preference rows after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreferenceList"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /v1/callbacks/{provider}:
    post:
      operationId: receiveCallback
      summary: Provider delivery report (public, signature checked)
      description: Stored once per provider event id; repeats return duplicate true and change nothing.
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [fake, resend, africastalking] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [received, matched, duplicate]
                properties:
                  received: { type: boolean }
                  matched: { type: boolean, description: False when no delivery has this provider reference }
                  duplicate: { type: boolean }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Standard error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Channel:
      type: string
      enum: [push, sms, email]
    CreateNotification:
      type: object
      required: [type, title, body, recipients, idempotencyKey]
      properties:
        type: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 5000 }
        urgent: { type: boolean, default: false, description: Urgent messages ignore quiet hours }
        idempotencyKey: { type: string, maxLength: 128 }
        recipients:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            required: [userId]
            properties:
              userId: { type: string, format: uuid }
              childIds:
                type: array
                maxItems: 20
                items: { type: string, format: uuid }
              channelsAllowed:
                type: array
                description: Empty or missing means every channel
                items:
                  $ref: "#/components/schemas/Channel"
              email: { type: string }
              phone: { type: string }
    Notification:
      type: object
      required: [id, type, title, body, urgent, senderIdentityId, idempotencyKey, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        urgent: { type: boolean }
        senderIdentityId: { type: [string, "null"], format: uuid }
        idempotencyKey: { type: string }
        createdAt: { type: string, format: date-time }
    InboxItem:
      type: object
      required: [id, type, title, body, urgent, childIds, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        urgent: { type: boolean }
        childIds:
          type: array
          items: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
    Preference:
      type: object
      required: [type, channels]
      properties:
        type: { type: string, description: Notification type, or * for the default }
        channels:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Channel"
        quietStart: { type: [string, "null"], pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        quietEnd: { type: [string, "null"], pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
    PreferenceList:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/Preference"
    ErrorEnvelope:
      type: object
      required: [error, code, requestId]
      properties:
        error: { type: string }
        code: { type: string }
        details: { type: object, additionalProperties: true }
        requestId: { type: string }
